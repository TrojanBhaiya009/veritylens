<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerityLens - 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <img src="../icons/icon-48.png" alt="VerityLens" class="logo">
      <h1>VerityLens 设置</h1>
    </header>
    
    <div class="settings-section">
      <h2>🤖 模型配置</h2>
      
      <div class="form-group">
        <label for="provider">选择 AI 提供商</label>
        <select id="provider">
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic (Claude)</option>
          <option value="google">Google (Gemini)</option>
          <option value="openrouter">OpenRouter</option>
          <option value="ollama">Ollama (本地)</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="api-key">API Key</label>
        <div class="input-with-button">
          <input type="password" id="api-key" placeholder="输入您的 API Key">
          <button id="toggle-api-key" type="button">显示</button>
        </div>
        <div class="help-text" id="api-key-help">
          OpenAI: sk-...<br>
          Anthropic: sk-ant-...<br>
          Google: AIza...<br>
          OpenRouter: sk-or-...
        </div>
      </div>
      
      <div class="form-group" id="base-url-group" style="display:none;">
        <label for="base-url">自定义 Base URL（可选）</label>
        <input type="text" id="base-url" placeholder="https://your-custom-endpoint.com/v1">
        <div class="help-text">Ollama 用户：默认为 http://localhost:11434</div>
      </div>
      
      <div class="form-group">
        <label for="model">模型名称（可选，留空使用默认）</label>
        <input type="text" id="model" placeholder="例如: gpt-4o, claude-3-5-sonnet-20241022">
        <div class="help-text" id="model-help"></div>
      </div>
      
      <div class="form-group">
        <label for="temperature">温度（Temperature）</label>
        <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.3">
        <div class="range-value"><span id="temperature-value">0.3</span></div>
      </div>
    </div>
    
    <div class="settings-section">
      <h2>🔍 搜索增强</h2>
      
      <div class="form-group">
        <label>
          <input type="checkbox" id="enable-search-enhancement" checked>
          启用搜索结果增强（标记广告、提示官方网站）
        </label>
      </div>
    </div>
    
    <div class="settings-section">
      <h2>💾 操作</h2>
      
      <div class="buttons">
        <button id="save-btn" class="primary">保存设置</button>
        <button id="test-btn">测试连接</button>
        <button id="reset-btn" class="danger">重置</button>
      </div>
      
      <div id="status-message"></div>
    </div>
    
    <div class="footer">
      <p>VerityLens v1.0.0</p>
      <p>开源项目：<a href="https://github.com/TrojanBhaiya009/veritylens" target="_blank">GitHub</a></p>
    </div>
  </div>
  
  <script src="options.js"></script>
</body>
</html>
