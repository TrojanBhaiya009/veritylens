<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerityLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <img src="../icons/icon-48.png" alt="VerityLens" class="logo">
      <h1>VerityLens</h1>
    </header>
    
    <div id="verification-result">
      <div class="loading" id="loading" style="display:none;">
        <div class="spinner"></div>
        <p>正在核查...</p>
      </div>
      
      <div class="result" id="result" style="display:none;">
        <div class="verdict" id="verdict"></div>
        <div class="confidence" id="confidence"></div>
        <div class="evidence" id="evidence"></div>
        <div class="sources" id="sources"></div>
      </div>
      
      <div class="empty" id="empty">
        <p>📋 选中文字后右键"核查真伪"</p>
        <p>或粘贴文本到下方快速核查</p>
      </div>
    </div>
    
    <div class="quick-verify">
      <textarea id="quick-input" placeholder="粘贴要核查的文本..."></textarea>
      <button id="quick-verify-btn">快速核查</button>
    </div>
    
    <div class="footer">
      <a href="#" id="open-options">设置</a>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
